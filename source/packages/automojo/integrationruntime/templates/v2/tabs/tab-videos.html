<!DOCTYPE html>
<html lang="en">
    <!--
        __author__ = "Myron Walker"
        __copyright__ = "Copyright 2025, Automation Mojo LLC"
        
        Video Artifact Viewer Tab
        
        This tab page displays video artifacts (MP4, WebM, OGG) from test execution.
        Videos are displayed with playback controls and can be expanded to full screen.
    -->
    <head>
        <title>Videos</title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">

        <script type="text/javascript" src="/static/v2/javascript/testsummary-helpers.js"></script>
        <link rel="stylesheet" href="/static/v2/styles/tabs-responsive.css" ></link>

        <style>
            * {
                box-sizing: border-box;
            }

            .page-style {
                margin: 0px;
                padding: 10px;
                font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
                width: 100%;
            }

            .page-header {
                display: flex;
                justify-content: space-between;
                align-items: center;
                margin-bottom: 15px;
                padding-bottom: 10px;
                border-bottom: 1px solid #ddd;
            }

            .page-title {
                margin: 0;
                font-size: 1.5em;
                color: #333;
            }

            .video-grid {
                display: grid;
                grid-template-columns: repeat(auto-fill, minmax(min(400px, 100%), 1fr));
                gap: 20px;
                width: 100%;
            }

            .video-container {
                display: flex;
                flex-direction: column;
                border: 1px solid #ddd;
                border-radius: 8px;
                overflow: hidden;
                background-color: #f9f9f9;
            }

            .video-header {
                display: flex;
                justify-content: space-between;
                align-items: center;
                padding: 10px 15px;
                background-color: #f5f5f5;
                border-bottom: 1px solid #ddd;
                flex-wrap: wrap;
                gap: 8px;
            }

            .video-filename {
                font-weight: bold;
                color: #333;
                word-break: break-all;
            }

            .video-controls {
                display: flex;
                gap: 8px;
            }

            .video-btn {
                padding: 8px 12px;
                border: 1px solid #ccc;
                border-radius: 4px;
                background-color: #fff;
                cursor: pointer;
                font-size: 14px;
                color: #333;
                min-width: 44px;
                min-height: 44px;
            }

            .video-btn:hover {
                background-color: #e9e9e9;
            }

            .video-wrapper {
                position: relative;
                background-color: #000;
                width: 100%;
            }

            .video-wrapper video {
                width: 100%;
                height: auto;
                display: block;
            }

            .video-meta {
                padding: 8px 15px;
                font-size: 12px;
                color: #666;
                background-color: #f5f5f5;
                border-top: 1px solid #ddd;
            }

            .no-videos {
                padding: 40px;
                text-align: center;
                color: #666;
                grid-column: 1 / -1;
            }

            .loading {
                padding: 40px;
                text-align: center;
                color: #666;
            }

            /* Fullscreen styles */
            .video-container.fullscreen {
                position: fixed;
                top: 0;
                left: 0;
                width: 100vw;
                height: 100vh;
                z-index: 9999;
                border-radius: 0;
                background-color: #000;
            }

            .video-container.fullscreen .video-wrapper {
                flex: 1;
                display: flex;
                align-items: center;
                justify-content: center;
            }

            .video-container.fullscreen .video-wrapper video {
                max-height: calc(100vh - 100px);
                width: auto;
                max-width: 100%;
            }

            .video-container.fullscreen .video-header {
                background-color: rgba(0, 0, 0, 0.8);
                border-bottom: 1px solid #333;
            }

            .video-container.fullscreen .video-filename {
                color: #fff;
            }

            .video-container.fullscreen .video-meta {
                background-color: rgba(0, 0, 0, 0.8);
                border-top: 1px solid #333;
                color: #ccc;
            }
            
            /* Responsive adjustments */
            @media (max-width: 480px) {
                .video-grid {
                    grid-template-columns: 1fr;
                }
                
                .video-header {
                    padding: 8px 10px;
                }
                
                .video-filename {
                    font-size: 14px;
                }
                
                .video-btn {
                    padding: 6px 10px;
                    font-size: 12px;
                }
            }
        </style>

        <script type="text/javascript">
            // Supported video file extensions
            const VIDEO_EXTENSIONS = ["mp4", "webm", "ogg", "mov", "avi"];
            
            // Global state
            let g_videos = [];

            /**
             * Fetch video files from the catalog
             */
            async function fetch_video_files() {
                try {
                    const catalog = await fetch_json("catalog.json");
                    if (!catalog || !catalog.files) {
                        return [];
                    }
                    
                    return catalog.files.filter(filename => {
                        const ext = filename.split('.').pop().toLowerCase();
                        return VIDEO_EXTENSIONS.includes(ext);
                    });
                } catch (err) {
                    console.error("Failed to load catalog:", err);
                    return [];
                }
            }

            /**
             * Format file size for display
             */
            function formatFileSize(bytes) {
                if (bytes === 0) return '0 Bytes';
                const k = 1024;
                const sizes = ['Bytes', 'KB', 'MB', 'GB'];
                const i = Math.floor(Math.log(bytes) / Math.log(k));
                return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
            }

            /**
             * Format duration for display
             */
            function formatDuration(seconds) {
                if (isNaN(seconds) || seconds === Infinity) return '--:--';
                const mins = Math.floor(seconds / 60);
                const secs = Math.floor(seconds % 60);
                return `${mins}:${secs.toString().padStart(2, '0')}`;
            }

            /**
             * Toggle fullscreen mode for a video container
             */
            function toggleFullscreen(index) {
                const container = document.getElementById(`video-container-${index}`);
                if (container.classList.contains('fullscreen')) {
                    container.classList.remove('fullscreen');
                    document.body.style.overflow = '';
                } else {
                    container.classList.add('fullscreen');
                    document.body.style.overflow = 'hidden';
                }
            }

            /**
             * Download a video file
             */
            function downloadVideo(filename) {
                const link = document.createElement('a');
                link.href = filename;
                link.download = filename;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            }

            /**
             * Update video metadata display when metadata is loaded
             */
            function onVideoMetadataLoaded(videoEl, index) {
                const metaEl = document.getElementById(`video-meta-${index}`);
                if (metaEl && videoEl) {
                    const duration = formatDuration(videoEl.duration);
                    const width = videoEl.videoWidth;
                    const height = videoEl.videoHeight;
                    metaEl.textContent = `Duration: ${duration} | Resolution: ${width}x${height}`;
                }
            }

            /**
             * Create a video container element
             */
            function createVideoContainer(filename, index) {
                const container = document.createElement('div');
                container.className = 'video-container';
                container.id = `video-container-${index}`;
                
                container.innerHTML = `
                    <div class="video-header">
                        <span class="video-filename">${filename}</span>
                        <div class="video-controls">
                            <button class="video-btn" onclick="toggleFullscreen(${index})" title="Toggle Fullscreen">⛶</button>
                            <button class="video-btn" onclick="downloadVideo('${filename}')" title="Download">⬇</button>
                        </div>
                    </div>
                    <div class="video-wrapper">
                        <video 
                            controls 
                            preload="metadata"
                            onloadedmetadata="onVideoMetadataLoaded(this, ${index})"
                        >
                            <source src="${filename}" type="video/${filename.split('.').pop().toLowerCase()}">
                            Your browser does not support the video tag.
                        </video>
                    </div>
                    <div class="video-meta" id="video-meta-${index}">
                        Loading video metadata...
                    </div>
                `;
                
                return container;
            }

            /**
             * Refresh the video display
             */
            async function refresh_videos() {
                const containerEl = document.getElementById('video-grid');
                containerEl.innerHTML = '<div class="loading">Loading video files...</div>';
                
                const videoFiles = await fetch_video_files();
                
                if (videoFiles.length === 0) {
                    containerEl.innerHTML = '<div class="no-videos">No video files found in this directory.</div>';
                    return;
                }
                
                containerEl.innerHTML = '';
                g_videos = videoFiles;
                
                videoFiles.forEach((filename, index) => {
                    const videoEl = createVideoContainer(filename, index);
                    containerEl.appendChild(videoEl);
                });
            }

            /**
             * Handle escape key to exit fullscreen
             */
            document.addEventListener('keydown', function(event) {
                if (event.key === 'Escape') {
                    const fullscreenEl = document.querySelector('.video-container.fullscreen');
                    if (fullscreenEl) {
                        fullscreenEl.classList.remove('fullscreen');
                        document.body.style.overflow = '';
                    }
                }
            });

            /**
             * Initialize the page
             */
            async function initPage() {
                await refresh_videos();
            }

            // Start loading when the page is ready
            document.addEventListener('DOMContentLoaded', initPage);
        </script>
    </head>

    <body class="page-style">
        <div class="page-header">
            <h3 class="page-title">Videos</h3>
        </div>
        
        <div id="video-grid" class="video-grid">
            <div class="loading">Loading...</div>
        </div>
    </body>
</html>
