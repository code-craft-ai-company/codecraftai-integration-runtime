<!DOCTYPE html>
<html lang="en">
    <!--

        JSON/XML Data Viewer Tab
        
        This tab page displays JSON and XML data files with syntax highlighting,
        collapsible tree view, and search functionality.
    -->
    <head>
        <title>Data Files</title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">

        <script type="text/javascript" src="/static/v2/javascript/testsummary-helpers.js"></script>
        <link rel="stylesheet" href="/static/v2/styles/tabs-responsive.css" ></link>

        <style>
            * {
                box-sizing: border-box;
            }

            body {
                margin: 0;
                padding: 10px;
                font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
                font-size: 14px;
                line-height: 1.5;
            }

            .page-header {
                display: flex;
                flex-wrap: wrap;
                justify-content: space-between;
                align-items: center;
                margin-bottom: 15px;
                padding-bottom: 10px;
                border-bottom: 1px solid #ddd;
                gap: 10px;
            }

            .page-title {
                margin: 0;
                font-size: 1.5em;
                color: #333;
            }

            .search-container {
                display: flex;
                flex-wrap: wrap;
                gap: 10px;
                align-items: center;
            }

            .search-input {
                padding: 8px 12px;
                border: 1px solid #ccc;
                border-radius: 4px;
                font-size: 14px;
                width: 250px;
                max-width: 100%;
                min-height: 44px;
            }

            .search-input:focus {
                outline: none;
                border-color: #2E5A8F;
                box-shadow: 0 0 3px rgba(46, 90, 143, 0.3);
            }

            .view-toggle {
                display: flex;
                gap: 5px;
            }

            .view-btn {
                padding: 8px 12px;
                border: 1px solid #ccc;
                border-radius: 4px;
                background-color: #fff;
                cursor: pointer;
                font-size: 12px;
                min-height: 44px;
                min-width: 44px;
            }

            .view-btn:hover {
                background-color: #e9e9e9;
            }

            .view-btn.active {
                background-color: #2E5A8F;
                color: #fff;
                border-color: #2E5A8F;
            }

            .data-container {
                margin-bottom: 20px;
                border: 1px solid #ddd;
                border-radius: 4px;
                overflow: hidden;
            }

            .data-header {
                display: flex;
                flex-wrap: wrap;
                justify-content: space-between;
                align-items: center;
                padding: 10px 15px;
                background-color: #f5f5f5;
                border-bottom: 1px solid #ddd;
                cursor: pointer;
                gap: 10px;
            }

            .data-header:hover {
                background-color: #eee;
            }

            .data-header-left {
                display: flex;
                flex-wrap: wrap;
                align-items: center;
                gap: 10px;
            }

            .data-filename {
                font-weight: bold;
                color: #333;
                word-break: break-all;
            }

            .data-type {
                font-size: 11px;
                padding: 2px 6px;
                border-radius: 3px;
                text-transform: uppercase;
            }

            .data-type.json {
                background-color: #f0db4f;
                color: #323330;
            }

            .data-type.xml {
                background-color: #e44d26;
                color: #fff;
            }

            .data-meta {
                font-size: 12px;
                color: #666;
            }

            .data-header-right {
                display: flex;
                flex-wrap: wrap;
                align-items: center;
                gap: 10px;
            }

            .data-btn {
                padding: 8px 12px;
                border: 1px solid #ccc;
                border-radius: 4px;
                background-color: #fff;
                cursor: pointer;
                font-size: 12px;
                min-height: 44px;
            }

            .data-btn:hover {
                background-color: #e9e9e9;
            }

            .data-toggle {
                font-size: 18px;
                color: #666;
                user-select: none;
            }

            .data-content {
                max-height: 600px;
                overflow: auto;
                background-color: #1e1e1e;
                color: #d4d4d4;
                -webkit-overflow-scrolling: touch;
            }

            .data-content.collapsed {
                display: none;
            }

            .data-content pre {
                margin: 0;
                padding: 15px;
                font-family: 'Consolas', 'Monaco', 'Courier New', monospace;
                font-size: 13px;
                line-height: 1.4;
                white-space: pre-wrap;
                word-wrap: break-word;
            }

            /* JSON Syntax Highlighting */
            .json-key {
                color: #9cdcfe;
            }

            .json-string {
                color: #ce9178;
            }

            .json-number {
                color: #b5cea8;
            }

            .json-boolean {
                color: #569cd6;
            }

            .json-null {
                color: #569cd6;
            }

            .json-bracket {
                color: #ffd700;
            }

            /* XML Syntax Highlighting */
            .xml-tag {
                color: #569cd6;
            }

            .xml-attr-name {
                color: #9cdcfe;
            }

            .xml-attr-value {
                color: #ce9178;
            }

            .xml-text {
                color: #d4d4d4;
            }

            .xml-comment {
                color: #6a9955;
                font-style: italic;
            }

            /* Tree View Styles */
            .tree-view {
                padding: 15px;
            }

            .tree-node {
                margin-left: 20px;
            }

            .tree-node-header {
                display: flex;
                align-items: center;
                cursor: pointer;
                padding: 2px 0;
            }

            .tree-node-header:hover {
                background-color: #2d2d2d;
            }

            .tree-toggle {
                width: 16px;
                color: #858585;
                user-select: none;
            }

            .tree-key {
                color: #9cdcfe;
                margin-right: 5px;
            }

            .tree-value {
                color: #ce9178;
            }

            .tree-value.number {
                color: #b5cea8;
            }

            .tree-value.boolean {
                color: #569cd6;
            }

            .tree-value.null {
                color: #569cd6;
            }

            .tree-children {
                display: none;
            }

            .tree-children.expanded {
                display: block;
            }

            .tree-type {
                color: #858585;
                font-size: 11px;
                margin-left: 5px;
            }

            .highlight {
                background-color: #613214;
                color: #fff;
                padding: 1px 2px;
                border-radius: 2px;
            }

            .no-data {
                padding: 40px;
                text-align: center;
                color: #666;
            }

            .loading {
                padding: 40px;
                text-align: center;
                color: #666;
            }

            .copy-feedback {
                position: fixed;
                bottom: 20px;
                right: 20px;
                padding: 10px 20px;
                background-color: #4caf50;
                color: #fff;
                border-radius: 4px;
                display: none;
                z-index: 1000;
            }
        </style>

        <script type="text/javascript">
            // Supported data file extensions
            const DATA_EXTENSIONS = ["json", "xml", "jsos"];
            
            // Global state
            let g_dataFiles = [];
            let g_searchTerm = "";
            let g_viewMode = "formatted"; // "formatted" or "tree"

            /**
             * Fetch data files from the catalog
             */
            async function fetch_data_files() {
                try {
                    const catalog = await fetch_json("catalog.json");
                    if (!catalog || !catalog.files) {
                        return [];
                    }
                    
                    return catalog.files.filter(filename => {
                        const ext = filename.split('.').pop().toLowerCase();
                        return DATA_EXTENSIONS.includes(ext);
                    });
                } catch (err) {
                    console.error("Failed to load catalog:", err);
                    return [];
                }
            }

            /**
             * Fetch the content of a data file
             */
            async function fetch_data_content(filename) {
                try {
                    const response = await fetch(filename);
                    if (!response.ok) {
                        throw new Error(`HTTP ${response.status}`);
                    }
                    return await response.text();
                } catch (err) {
                    console.error(`Failed to load ${filename}:`, err);
                    return null;
                }
            }

            /**
             * Escape HTML entities
             */
            function escapeHtml(str) {
                return str
                    .replace(/&/g, '&amp;')
                    .replace(/</g, '&lt;')
                    .replace(/>/g, '&gt;')
                    .replace(/"/g, '&quot;');
            }

            /**
             * Escape special regex characters
             */
            function escapeRegex(string) {
                return string.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
            }

            /**
             * Apply search highlighting
             */
            function applyHighlight(text, searchTerm) {
                if (!searchTerm) return text;
                const regex = new RegExp(`(${escapeRegex(searchTerm)})`, 'gi');
                return text.replace(regex, '<span class="highlight">$1</span>');
            }

            /**
             * Format JSON with syntax highlighting
             */
            function formatJson(content, searchTerm) {
                try {
                    const obj = JSON.parse(content);
                    const formatted = JSON.stringify(obj, null, 2);
                    
                    // Apply syntax highlighting
                    let highlighted = escapeHtml(formatted);
                    
                    // Highlight keys
                    highlighted = highlighted.replace(/"([^"]+)":/g, '<span class="json-key">"$1"</span>:');
                    
                    // Highlight string values
                    highlighted = highlighted.replace(/: "([^"]*)"/g, ': <span class="json-string">"$1"</span>');
                    
                    // Highlight numbers
                    highlighted = highlighted.replace(/: (-?\d+\.?\d*)/g, ': <span class="json-number">$1</span>');
                    
                    // Highlight booleans
                    highlighted = highlighted.replace(/: (true|false)/g, ': <span class="json-boolean">$1</span>');
                    
                    // Highlight null
                    highlighted = highlighted.replace(/: (null)/g, ': <span class="json-null">$1</span>');
                    
                    // Highlight brackets
                    highlighted = highlighted.replace(/([{}\[\]])/g, '<span class="json-bracket">$1</span>');
                    
                    // Apply search highlighting
                    if (searchTerm) {
                        highlighted = applyHighlight(highlighted, searchTerm);
                    }
                    
                    return highlighted;
                } catch (err) {
                    return `<span style="color: #f48771;">Error parsing JSON: ${escapeHtml(err.message)}</span>\n\n${escapeHtml(content)}`;
                }
            }

            /**
             * Format XML with syntax highlighting
             */
            function formatXml(content, searchTerm) {
                let formatted = content;
                
                // Simple XML formatting
                let indent = 0;
                const lines = [];
                const tokens = formatted.match(/<[^>]+>|[^<]+/g) || [];
                
                tokens.forEach(token => {
                    if (token.startsWith('</')) {
                        indent--;
                        lines.push('  '.repeat(Math.max(0, indent)) + token);
                    } else if (token.startsWith('<') && token.endsWith('/>')) {
                        lines.push('  '.repeat(indent) + token);
                    } else if (token.startsWith('<')) {
                        lines.push('  '.repeat(indent) + token);
                        if (!token.startsWith('<?') && !token.startsWith('<!')) {
                            indent++;
                        }
                    } else {
                        const trimmed = token.trim();
                        if (trimmed) {
                            lines.push('  '.repeat(indent) + trimmed);
                        }
                    }
                });
                
                formatted = lines.join('\n');
                
                // Escape HTML
                let highlighted = escapeHtml(formatted);
                
                // Highlight tags
                highlighted = highlighted.replace(/&lt;(\/?[\w:-]+)/g, '&lt;<span class="xml-tag">$1</span>');
                highlighted = highlighted.replace(/([\w:-]+)&gt;/g, '<span class="xml-tag">$1</span>&gt;');
                
                // Highlight attributes
                highlighted = highlighted.replace(/(\s)([\w:-]+)=/g, '$1<span class="xml-attr-name">$2</span>=');
                highlighted = highlighted.replace(/="([^"]*)"/g, '="<span class="xml-attr-value">$1</span>"');
                
                // Highlight comments
                highlighted = highlighted.replace(/&lt;!--(.*)--&gt;/g, '<span class="xml-comment">&lt;!--$1--&gt;</span>');
                
                // Apply search highlighting
                if (searchTerm) {
                    highlighted = applyHighlight(highlighted, searchTerm);
                }
                
                return highlighted;
            }

            /**
             * Format JSOS (JSON Stream) with syntax highlighting
             */
            function formatJsos(content, searchTerm) {
                const records = content.split('\x1e').filter(r => r.trim());
                let formatted = '';
                
                records.forEach((record, index) => {
                    try {
                        const obj = JSON.parse(record.trim());
                        formatted += `// Record ${index + 1}\n`;
                        formatted += formatJson(JSON.stringify(obj), searchTerm);
                        formatted += '\n\n';
                    } catch (err) {
                        formatted += `// Record ${index + 1} (parse error)\n`;
                        formatted += escapeHtml(record.trim());
                        formatted += '\n\n';
                    }
                });
                
                return formatted;
            }

            /**
             * Build tree view for JSON data
             */
            function buildTreeView(data, key = null, depth = 0) {
                const nodeId = `tree-${Date.now()}-${Math.random().toString(36).substr(2, 9)}`;
                
                if (data === null) {
                    return `<span class="tree-value null">null</span>`;
                }
                
                if (typeof data === 'boolean') {
                    return `<span class="tree-value boolean">${data}</span>`;
                }
                
                if (typeof data === 'number') {
                    return `<span class="tree-value number">${data}</span>`;
                }
                
                if (typeof data === 'string') {
                    return `<span class="tree-value">"${escapeHtml(data)}"</span>`;
                }
                
                if (Array.isArray(data)) {
                    if (data.length === 0) {
                        return `<span class="json-bracket">[]</span>`;
                    }
                    
                    let html = `<div class="tree-node">`;
                    html += `<div class="tree-node-header" onclick="toggleTreeNode('${nodeId}')">`;
                    html += `<span class="tree-toggle" id="toggle-${nodeId}">▶</span>`;
                    if (key !== null) {
                        html += `<span class="tree-key">"${escapeHtml(key)}":</span>`;
                    }
                    html += `<span class="json-bracket">[</span>`;
                    html += `<span class="tree-type">Array(${data.length})</span>`;
                    html += `</div>`;
                    html += `<div class="tree-children" id="${nodeId}">`;
                    
                    data.forEach((item, index) => {
                        html += `<div class="tree-node">`;
                        html += `<span class="tree-key">${index}:</span>`;
                        html += buildTreeView(item, null, depth + 1);
                        html += `</div>`;
                    });
                    
                    html += `</div>`;
                    html += `<span class="json-bracket">]</span>`;
                    html += `</div>`;
                    return html;
                }
                
                if (typeof data === 'object') {
                    const keys = Object.keys(data);
                    if (keys.length === 0) {
                        return `<span class="json-bracket">{}</span>`;
                    }
                    
                    let html = `<div class="tree-node">`;
                    html += `<div class="tree-node-header" onclick="toggleTreeNode('${nodeId}')">`;
                    html += `<span class="tree-toggle" id="toggle-${nodeId}">▶</span>`;
                    if (key !== null) {
                        html += `<span class="tree-key">"${escapeHtml(key)}":</span>`;
                    }
                    html += `<span class="json-bracket">{</span>`;
                    html += `<span class="tree-type">Object(${keys.length})</span>`;
                    html += `</div>`;
                    html += `<div class="tree-children" id="${nodeId}">`;
                    
                    keys.forEach(k => {
                        html += `<div class="tree-node">`;
                        html += `<span class="tree-key">"${escapeHtml(k)}":</span>`;
                        html += buildTreeView(data[k], null, depth + 1);
                        html += `</div>`;
                    });
                    
                    html += `</div>`;
                    html += `<span class="json-bracket">}</span>`;
                    html += `</div>`;
                    return html;
                }
                
                return `<span class="tree-value">${escapeHtml(String(data))}</span>`;
            }

            /**
             * Toggle tree node expansion
             */
            function toggleTreeNode(nodeId) {
                const children = document.getElementById(nodeId);
                const toggle = document.getElementById(`toggle-${nodeId}`);
                
                if (children.classList.contains('expanded')) {
                    children.classList.remove('expanded');
                    toggle.textContent = '▶';
                } else {
                    children.classList.add('expanded');
                    toggle.textContent = '▼';
                }
            }

            /**
             * Toggle data content visibility
             */
            function toggleData(dataId) {
                const contentEl = document.getElementById(`data-content-${dataId}`);
                const toggleEl = document.getElementById(`data-toggle-${dataId}`);
                
                if (contentEl.classList.contains('collapsed')) {
                    contentEl.classList.remove('collapsed');
                    toggleEl.textContent = '−';
                } else {
                    contentEl.classList.add('collapsed');
                    toggleEl.textContent = '+';
                }
            }

            /**
             * Copy content to clipboard
             */
            function copyContent(index, event) {
                event.stopPropagation();
                const dataFile = g_dataFiles[index];
                if (dataFile && dataFile.content) {
                    navigator.clipboard.writeText(dataFile.content).then(() => {
                        showCopyFeedback();
                    });
                }
            }

            /**
             * Download a data file
             */
            function downloadData(filename, event) {
                event.stopPropagation();
                const link = document.createElement('a');
                link.href = filename;
                link.download = filename;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            }

            /**
             * Show copy feedback
             */
            function showCopyFeedback() {
                const feedback = document.getElementById('copy-feedback');
                feedback.style.display = 'block';
                setTimeout(() => {
                    feedback.style.display = 'none';
                }, 2000);
            }

            /**
             * Get file type from extension
             */
            function getFileType(filename) {
                const ext = filename.split('.').pop().toLowerCase();
                if (ext === 'json' || ext === 'jsos') return 'json';
                if (ext === 'xml') return 'xml';
                return 'json';
            }

            /**
             * Format content based on file type
             */
            function formatContent(content, fileType, searchTerm) {
                if (fileType === 'xml') {
                    return formatXml(content, searchTerm);
                }
                
                // Check if it's JSOS
                if (content.includes('\x1e')) {
                    return formatJsos(content, searchTerm);
                }
                
                return formatJson(content, searchTerm);
            }

            /**
             * Create a data container element
             */
            function createDataContainer(filename, content, index) {
                const container = document.createElement('div');
                container.className = 'data-container';
                container.id = `data-${index}`;
                
                const fileType = getFileType(filename);
                const fileSize = new Blob([content]).size;
                const sizeStr = fileSize > 1024 
                    ? `${(fileSize / 1024).toFixed(1)} KB` 
                    : `${fileSize} bytes`;
                
                let formattedContent;
                if (g_viewMode === 'tree' && fileType === 'json' && !content.includes('\x1e')) {
                    try {
                        const obj = JSON.parse(content);
                        formattedContent = `<div class="tree-view">${buildTreeView(obj)}</div>`;
                    } catch (err) {
                        formattedContent = `<pre>${formatContent(content, fileType, g_searchTerm)}</pre>`;
                    }
                } else {
                    formattedContent = `<pre>${formatContent(content, fileType, g_searchTerm)}</pre>`;
                }
                
                container.innerHTML = `
                    <div class="data-header" onclick="toggleData(${index})">
                        <div class="data-header-left">
                            <span class="data-filename">${filename}</span>
                            <span class="data-type ${fileType}">${fileType}</span>
                            <span class="data-meta">${sizeStr}</span>
                        </div>
                        <div class="data-header-right">
                            <button class="data-btn" onclick="copyContent(${index}, event)" title="Copy">📋 Copy</button>
                            <button class="data-btn" onclick="downloadData('${filename}', event)" title="Download">⬇ Download</button>
                            <span class="data-toggle" id="data-toggle-${index}">−</span>
                        </div>
                    </div>
                    <div class="data-content" id="data-content-${index}">
                        ${formattedContent}
                    </div>
                `;
                
                return container;
            }

            /**
             * Re-render all data content
             */
            function rerenderData() {
                g_dataFiles.forEach((dataFile, index) => {
                    const contentEl = document.getElementById(`data-content-${index}`);
                    if (contentEl && dataFile.content) {
                        const fileType = getFileType(dataFile.filename);
                        
                        if (g_viewMode === 'tree' && fileType === 'json' && !dataFile.content.includes('\x1e')) {
                            try {
                                const obj = JSON.parse(dataFile.content);
                                contentEl.innerHTML = `<div class="tree-view">${buildTreeView(obj)}</div>`;
                            } catch (err) {
                                contentEl.innerHTML = `<pre>${formatContent(dataFile.content, fileType, g_searchTerm)}</pre>`;
                            }
                        } else {
                            contentEl.innerHTML = `<pre>${formatContent(dataFile.content, fileType, g_searchTerm)}</pre>`;
                        }
                    }
                });
            }

            /**
             * Handle search input
             */
            function handleSearch(event) {
                g_searchTerm = event.target.value;
                rerenderData();
            }

            /**
             * Set view mode
             */
            function setViewMode(mode) {
                g_viewMode = mode;
                
                document.querySelectorAll('.view-btn').forEach(btn => {
                    btn.classList.remove('active');
                });
                document.querySelector(`.view-btn[data-mode="${mode}"]`).classList.add('active');
                
                rerenderData();
            }

            /**
             * Refresh the data display
             */
            async function refreshData() {
                const containerEl = document.getElementById('data-container');
                containerEl.innerHTML = '<div class="loading">Loading data files...</div>';
                
                const dataFiles = await fetch_data_files();
                
                if (dataFiles.length === 0) {
                    containerEl.innerHTML = '<div class="no-data">No JSON or XML files found in this directory.</div>';
                    return;
                }
                
                containerEl.innerHTML = '';
                g_dataFiles = [];
                
                for (let i = 0; i < dataFiles.length; i++) {
                    const filename = dataFiles[i];
                    const content = await fetch_data_content(filename);
                    
                    if (content !== null) {
                        g_dataFiles.push({ filename, content });
                        
                        const dataEl = createDataContainer(filename, content, g_dataFiles.length - 1);
                        containerEl.appendChild(dataEl);
                    }
                }
            }

            /**
             * Initialize the page
             */
            async function initPage() {
                await refreshData();
            }

            // Start loading when the page is ready
            document.addEventListener('DOMContentLoaded', initPage);
        </script>
    </head>

    <body>
        <div class="page-header">
            <h3 class="page-title">Data Files</h3>
            <div class="search-container">
                <input 
                    type="text" 
                    class="search-input" 
                    placeholder="Search in data..." 
                    oninput="handleSearch(event)"
                >
                <div class="view-toggle">
                    <button class="view-btn active" data-mode="formatted" onclick="setViewMode('formatted')">Formatted</button>
                    <button class="view-btn" data-mode="tree" onclick="setViewMode('tree')">Tree View</button>
                </div>
            </div>
        </div>
        
        <div id="data-container">
            <div class="loading">Loading...</div>
        </div>
        
        <div id="copy-feedback" class="copy-feedback">Copied to clipboard!</div>
    </body>
</html>
