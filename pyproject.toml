[project]
name = "codecraftai-integration-runtime"
version = "1.3.0"
description = "Code Craft AI - Integration Runtime"
readme = "README.rst"
license = "LicenseRef-CodeCraftAI-Source-Available"
authors = [{name = "Myron Walker", email = "myron.walker@gmail.com"}]
keywords = [
    "python"
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: POSIX",
]
requires-python = ">=3.10,<4.0"
dependencies = [
    "requests>=2.32.4,<3.0.0",
    "codecraftai-foundations>=1.0.0,<2.0.0",
    "codecraftai-xmodules>=1.0.0,<2.0.0",
    "codecraftai-extension>=1.0.0,<2.0.0",
    "codecraftai-this-app>=1.0.0,<2.0.0",
    "codecraftai-testbase>=1.0.0,<2.0.0",
]

[project.optional-dependencies]
websocket = ["websocket-client>=1.8.0,<2.0.0"]

[project.urls]
Repository = "https://github.com/code-craft-ai-company/codecraftai-integration-runtime"
Issues = "https://github.com/code-craft-ai-company/codecraftai-integration-runtime/issues"

[dependency-groups]
dev = []

[tool.poetry]
packages = [{include="ccai", from="source/packages"}]
# The README only marks the shared 'ccai' namespace directory in the source tree. It stays out of the
# wheel because several codecraftai packages install into that directory and a file there collides.
exclude = ["source/packages/ccai/README.md"]

[tool.ruff.lint]
# Deliberately narrow.  This gate exists for one reason: a bare `except:`
# swallows ConfigurationError and SemanticError, which derive from
# BaseException precisely so that they pass through ordinary handlers and end
# the run.  Catching them hides the original cause behind whatever error
# happens next.  See userguide/10-00-coding-standards.rst, exception-handling
# rules 5-7.  Use `except Exception:` when you mean "any ordinary failure".
select = ["E722"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
