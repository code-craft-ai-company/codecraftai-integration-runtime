[tool.poetry]
name = "codecraftai-integration-runtime"
description = "Code Craft AI - Integration Runtime"
version = "1.0.0"
authors = [
    "Myron Walker <myron.walker@gmail.com>"
]
readme = "README.rst"
license = "LicenseRef-CodeCraftAI-Dual-License"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: Other/Proprietary License",
    "Operating System :: POSIX"
]
keywords = [
    "python"
]
packages = [{include="ccai", from="source/packages"}]

[tool.poetry.dependencies]
python = ">=3.10,<4.0"
requests = "^2.32.4"
websocket-client = { version = "^1.8.0", optional = true }
codecraftai-errors = { version = "<2.0.0", source = "codecraftai" }
codecraftai-xmodules = { version = "<2.0.0", source = "codecraftai" }
codecraftai-extension = { version = "<2.0.0", source = "codecraftai" }
codecraftai-this-app = { version = "<2.0.0", source = "codecraftai" }
codecraftai-testbase = { version = "<2.0.0", source = "codecraftai" }

[tool.poetry.extras]
websocket = ["websocket-client"]

[tool.poetry.group.dev.dependencies]


[[tool.poetry.source]]
name = "codecraftai"
url = "https://code-craft.ai/licensed-repository/simple/"
priority = "supplemental"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
